version: 2
updates:
  # Dart/Flutter dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    reviewers:
      - "Dritonsallahu"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  # Workflows pin every action to a commit SHA (with a `# v<major>` comment).
  # Dependabot will follow that pin style automatically — when a referenced
  # action publishes a new release, dependabot opens a PR that swaps the SHA
  # and updates the trailing comment. Do NOT switch back to `@v<major>` tags.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    reviewers:
      - "Dritonsallahu"
    commit-message:
      prefix: "ci"
      include: "scope"
